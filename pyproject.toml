[project]
name = "eloverblik-mcp"
version = "0.2.0"
description = "Production-focused MCP server for the Danish Eloverblik customer API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.13.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.3",
]
authors = [
    { name = "awha86", email = "17437445+awha86@users.noreply.github.com" },
]
keywords = ["mcp", "eloverblik", "energy", "electricity", "gofastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
eloverblik-mcp = "eloverblik_mcp.server:main"

[project.urls]
Homepage = "https://github.com/awha86/eloverblik_api_mcp"
Repository = "https://github.com/awha86/eloverblik_api_mcp"
Issues = "https://github.com/awha86/eloverblik_api_mcp/issues"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
